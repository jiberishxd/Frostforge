name: Validate addon

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Check Lua behavior
        run: lua5.1 tests/run.lua
      - name: Verify cast preview matches runtime pieces
        run: lua5.1 tools/export_cast_preview.lua && git diff --exit-code -- artwork/cast-bars/runtime-borders.js
      - name: Install artwork test dependencies
        run: python3 -m pip install -r tools/requirements-artwork.txt
      - name: Check approved artwork and shell registration
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check source, transparency and provenance
        run: python3 tools/check.py
      - name: Package both clients
        run: python3 tools/package.py
      - name: Verify exact package contents
        run: python3 tools/check.py --packages
      - name: Save validated player packages
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frostforge-packages
          overwrite: true
          path: |
            dist/*.zip
            dist/packages.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
