name: Feature, artwork feedback, or shared layout
description: Suggest an improvement or show how you use JiberishUI.
body:
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Feature request
        - Artwork feedback
        - A JiberishUI layout
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Describe it
      description: Explain the result you want or the layout you are sharing. Include the affected components, themes and UI providers.
    validations:
      required: true
  - type: textarea
    id: images
    attributes:
      label: Screenshots or references
      description: For artwork feedback, point to the exact area or fitting issue. Label game screenshots and mockups so the context is clear.
