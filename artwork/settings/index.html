<!doctype html><html lang="en"><meta charset="utf-8"><title>Jiberish's Frostforge settings preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#e5f0f8;font:14px system-ui}header{padding:16px 24px;background:#1a2833}header p{margin:6px 0;color:#abbfcf;font-size:12px}select{background:#213948;color:#fff;padding:7px;border:1px solid #52758b;margin-right:10px}#stage{position:relative;width:920px;height:700px;margin:22px auto;font-family:Georgia,serif;background:#09131b;box-shadow:0 15px 55px #000b}.node{position:absolute}.panel{border:1px solid #64696b;border-radius:1px;background:#15202c}.outer{border:6px ridge #797b75;border-radius:3px}.blizzard-button{border:2px outset #626968;background:linear-gradient(#304a62,#182c3d)}.label{white-space:pre-wrap;line-height:1.28;text-shadow:1px 1px 2px #000;overflow-wrap:break-word}.highlight{background:#689cc0;border:0}.frost-rim{background:transparent;border:3px ridge #86d4ff;border-radius:2px}.checkbox{border:3px ridge #9b855c;background:#0f1011}.check{text-align:center;color:#fed665;font:bold 22px Georgia}.slider{border:2px ridge #597688;background:#101d27}.thumb{position:absolute;top:-4px;width:12px;height:22px;border:2px ridge #c0aa7e;border-radius:6px;background:#7b6b4e}.art{background-repeat:no-repeat}.edit{display:flex;align-items:center;padding:0 12px;color:#e5f0f8;font:12px Georgia}
body.capture header{display:none}body.capture #stage{margin:10px auto}
</style><header><strong>Jiberish's Frostforge · Settings workshop</strong><p>Layout and text exported from the addon’s actual settings code. Browser approximations of Blizzard’s native textures and fonts; offline preview only.</p><select id="component"><option value="playerFrame">Player</option><option value="targetFrame">Target</option><option value="minimap">Minimap</option><option value="actionHub">Action hub</option></select><select id="page"><option>artwork</option><option>placement</option><option value="placement-advanced">placement · advanced sizing</option><option>fitting</option><option>cast</option><option>blizzard</option><option value="blizzard-style">blizzard · colors &amp; textures</option><option value="blizzard-power">blizzard · power colors</option><option value="blizzard-party-power">blizzard · party power colors</option><option value="blizzard-auras">blizzard · target buffs &amp; debuffs</option><option value="blizzard-cast-position">blizzard · target cast position</option><option value="blizzard-Health">blizzard · health text</option><option value="blizzard-Power">blizzard · power text</option><option value="blizzard-Level">blizzard · level text</option><option value="blizzard-CastName">blizzard · cast name</option><option value="blizzard-CastTime">blizzard · cast time</option><option>advanced</option><option>guide</option><option>profiles</option><option value="website">The Igloo</option><option>collection</option><option>backup</option><option value="setup-1">quick setup · theme</option><option value="setup-2">quick setup · decorations</option><option value="setup-3">quick setup · access</option></select></header><main id="stage"></main>
<script src="runtime-settings.js"></script><script>
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');
const stage=document.querySelector('#stage'),component=document.querySelector('#component'),page=document.querySelector('#page');
const anchor=a=>[a.includes('LEFT')?0:a.includes('RIGHT')?1:.5,a.includes('TOP')?0:a.includes('BOTTOM')?1:.5];
const vals=x=>Object.keys(x||{}).sort((a,b)=>+a-+b).map(k=>x[k]);
const textOnly=s=>String(s||'').replace(/\|c[0-9a-f]{8}/gi,'').replace(/\|r/g,'');
const rgba=c=>{const v=vals(c);return `rgba(${v[0]*255},${v[1]*255},${v[2]*255},${v[3]??1})`;};
const assetURL=path=>{if(path.includes('frostforge-logo'))return '../../docs/images/logo.png';if(path.includes('frostforge-stone'))return './frostforge-stone.png';const parts=path.split('\\'),folder=parts.at(-2).toLowerCase(),stem=parts.at(-1).replace('.tga','.png');return `../${folder==='unitframes'?'unit-frames':folder}/${folder==='portraits'?'atlases':'assets'}/${stem}`;};
function render(){
 const key=['collection','backup'].includes(page.value)||page.value.startsWith('setup-')?page.value:component.value+'-'+page.value;const nodes=settingsSnapshots.pages[key]||settingsSnapshots.pages[component.value+'-placement'],root=settingsSnapshots.roots?.[key]||settingsSnapshots.root,rootNode=nodes[root],rw=rootNode.w,rh=rootNode.h,cache={};stage.style.width=rw+'px';stage.style.height=rh+'px';stage.style.zoom=Math.min(1,(document.documentElement.clientWidth-20)/rw);stage.replaceChildren();
 function rect(id){if(cache[id])return cache[id];const n=nodes[id];if(!n||+id===root)return {x:0,y:0,w:rw,h:rh,z:0};
 let w=n.w,h=n.h;if(n.kind==='FontString'){const txt=textOnly(n.text),fs=n.font?.includes('Large')?20:n.font?.includes('Small')?12:14;w=n.justify?n.w:Math.max(1,txt.length*fs*.55);h=n.justify?Math.max(fs*1.28,txt.split('\n').reduce((sum,line)=>sum+Math.max(1,Math.ceil(line.length/(w/(fs*.53))))*fs*1.28,0)):fs*1.28;}
 if(n.all){const r=rect(n.all);return cache[id]={...r,z:rect(n.parent).z+.02};}
 const parent=rect(n.parent);const points=vals(n.points);let x=parent.x,y=parent.y;
 if(points.length){const p=vals(points[0]),r=rect(p[1]),[ax,ay]=anchor(p[0]),[bx,by]=anchor(p[2]);x=r.x+bx*r.w+p[3]-ax*w;y=r.y+by*r.h-p[4]-ay*h;
 if(points.length===2){const q=vals(points[1]),r2=rect(q[1]);const [qx,qy]=anchor(q[2]);w=r2.x+qx*r2.w+q[3]-x;h=r2.y+qy*r2.h-q[4]-y;}}
 return cache[id]={x,y,w,h,z:n.level? n.level-200:parent.z+(n.kind==='FontString'?.04:n.color&&!n.path?-.01:.01)};}
 const hoverNodes={};
 const sorted=Object.values(nodes).sort((a,b)=>rect(a.id).z-rect(b.id).z||((a.kind==='FontString'?4:a.layer==='BACKGROUND'?0:2)-(b.kind==='FontString'?4:b.layer==='BACKGROUND'?0:2))||a.id-b.id);
 for(const n of sorted){const r=rect(n.id),d=document.createElement('div');d.className='node';d.dataset.objectId=n.id;if(n.hoverFor){(hoverNodes[n.hoverFor]??=[]).push(d);d.style.visibility='hidden';}Object.assign(d.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px',opacity:n.alpha??1});if(n.backdrop){if(n.backdrop.bgFile)d.classList.add('panel',n.backdrop.edgeSize===32?'outer':'inset');else d.classList.add('frost-rim');if(n.backdropColor)d.style.backgroundColor=rgba(n.backdropColor);if(n.borderColor)d.style.borderColor=rgba(n.borderColor);if(n.backdrop.bgFile?.includes('JiberishUI')){d.style.backgroundImage=`url('${assetURL(n.backdrop.bgFile)}')`;d.style.backgroundSize=`${n.backdrop.tileSize}px ${n.backdrop.tileSize}px`;d.style.backgroundBlendMode='multiply';}}
 if(n.kind==='FontString'){d.classList.add('label');if(!n.justify){d.style.whiteSpace='nowrap';d.style.overflowWrap='normal';}d.textContent=textOnly(n.text);d.style.fontSize=(n.font?.includes('Large')?20:n.font?.includes('Small')?12:14)+'px';d.style.color=n.color?rgba(n.color):'#e5f0f8';if(n.justify)d.style.textAlign=n.justify.toLowerCase();}
 if(n.kind==='EditBox'){d.classList.add('edit');d.textContent=textOnly(n.text);d.style.overflow='hidden';d.style.whiteSpace='nowrap';}
 if(n.kind==='Slider'){d.classList.add('slider');const t=document.createElement('i');t.className='thumb';t.style.left=Math.max(0,Math.min(1,(n.value-n.minimum)/(n.maximum-n.minimum)))*(r.w-12)+'px';d.append(t);}
 if(n.path?.includes('Panel-Button-Up')||n.path?.includes('Panel-Button-Down'))d.classList.add('blizzard-button');if(n.path?.includes('Highlight'))d.classList.add('highlight');if(n.path?.includes('CheckBox-Up'))d.classList.add('checkbox');if(n.path?.includes('CheckBox-Check')){d.classList.add('check');d.textContent='✓';}
 if(n.path?.includes('JiberishUI')){d.classList.add('art');d.style.backgroundImage=`url('${assetURL(n.path)}')`;const uv=vals(n.uv);const ux=uv.length===4?uv[1]-uv[0]:1,vy=uv.length===4?uv[3]-uv[2]:1;d.style.backgroundSize=`${100/ux}% ${100/vy}%`;d.style.backgroundPosition=`${ux<1?uv[0]/(1-ux)*100:0}% ${vy<1?uv[2]/(1-vy)*100:0}%`;if(n.color){d.style.backgroundColor=rgba(n.color);d.style.backgroundBlendMode='multiply';}if(n.blend==='ADD')d.style.mixBlendMode='screen';}
 if(n.color&&n.kind==='Texture'&&!n.path){const c=vals(n.color);d.style.background=`rgba(${c[0]*255},${c[1]*255},${c[2]*255},${c[3]??1})`;}
 stage.append(d);
 }
 let hovered;
 function showHover(id){if(id===hovered)return;for(const d of hoverNodes[hovered]||[])d.style.visibility='hidden';hovered=id;for(const d of hoverNodes[id]||[])d.style.visibility='visible';stage.style.cursor=id?'pointer':'';}
 stage.onpointermove=event=>{let n=nodes[event.target.closest('.node')?.dataset.objectId];while(n&&n.kind!=='Button')n=nodes[n.parent];showHover(n?.id);};
 stage.onpointerleave=()=>showHover(undefined);
}

const requestedPage=new URLSearchParams(location.search).get('page');
if([...page.options].some(o=>o.value===requestedPage))page.value=requestedPage;
component.onchange=page.onchange=render;window.onresize=render;render();
</script></html>
